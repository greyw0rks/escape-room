<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Escape" shape-rendering="crispEdges">
  <!-- The mark: a keyhole punched into a plate. The whole premise of the game
       in one shape — the way out. Pixel-drawn on a 16x16 grid so it stays on
       the pixel grid at any multiple-of-16 size, matching the object icons. -->
  <rect width="64" height="64" fill="#ffd83d"/>
  <!-- hard black frame -->
  <path d="M0 0h64v4H0zM0 60h64v4H0zM0 0h4v64H0zM60 0h4v64h-4z" fill="#111111"/>
  <!-- keyhole: round bow over a tapered stem -->
  <path d="M24 16h16v4H24zM20 20h24v4H20zM20 24h24v4H20zM20 28h24v4H20zM24 32h16v4H24zM28 36h8v4h-8zM24 40h16v4H24zM20 44h24v4H20z" fill="#111111"/>
</svg>
